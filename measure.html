<!doctype html>
<html><head><meta charset="utf-8"><title>mesure</title><style>body{margin:0;background:#111}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { loadVehicle } from './src/vehicle.js';
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(1200, 800);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#223');
scene.add(new THREE.HemisphereLight('#fff', '#446', 1.2));
const sun = new THREE.DirectionalLight('#fff', 2); sun.position.set(4, 8, 3); scene.add(sun);
const camera = new THREE.PerspectiveCamera(45, 1.5, 0.05, 100);
camera.position.set(5, 2.5, 4); camera.lookAt(0, 0.8, 0);
scene.add(new THREE.GridHelper(10, 10));
scene.add(new THREE.AxesHelper(2));
const v = await loadVehicle();
scene.add(v.group);
window.__app = { THREE, scene, renderer, camera, vehicle: v };
window.__ready = true;
renderer.render(scene, camera);
</script></body></html>
